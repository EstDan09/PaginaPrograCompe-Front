<div class="page">
  <h1 class="title">Following</h1>

  <section class="card">
    @if (following().length > 0) {
      <ul class="list">
        @for (f of following(); track f.student_id) {
          <li class="row" role="button" tabindex="0" (click)="openProfile(f)">
            <div class="avatar">
              {{ (safeName(f.name) | slice:0:1) }}
            </div>
            <div class="name">{{ safeName(f.name) }}</div>
            <div class="chev">›</div>
          </li>
        }
      </ul>
    } @else {
      <div class="empty">
        <p class="empty-text">No estás siguiendo a nadie todavía.</p>
      </div>
    }
  </section>
</div>
