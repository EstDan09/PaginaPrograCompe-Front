<nav class="topbar">
  <div class="topbar__inner">
    <div class="brand">
      <span class="brand__name">CFTrainer</span>
    </div>

    @if (user()) {
      <div class="tabs">
        <a routerLink="/user" routerLinkActive="active" [routerLinkActiveOptions]="{ exact: true }">
          home
        </a>

        @if (role() !== 'coach') {
          <a [routerLink]="myStatsLink()" routerLinkActive="active"> statistics </a>
        }

        <a [routerLink]="myGroupsLink()" routerLinkActive="active"> teams </a>

        @if (role() !== 'coach') {
          <a [routerLink]="myFollowsLink()" routerLinkActive="active"> friends </a>
        }

        <a routerLink="/user/profile" routerLinkActive="active"> profile </a>

        @if (role() !== 'coach') {
          <a routerLink="/user/challenges" routerLinkActive="active"> challenges </a>
        }

        @if (role() !== 'coach') {
          <a routerLink="/user/verification" routerLinkActive="active"> verification </a>
        }
      </div>
    }

    <div class="right">
      @if (user()) {
        <span class="user"> {{ user()!.username }}</span>
        <button class="btn-ghost" type="button" (click)="onLogout()">Logout</button>
      } @else {
        <a class="login-btn" routerLink="/auth/login">
          <span class="icon"></span>
          <span>Login</span>
        </a>
      }
    </div>
  </div>
</nav>

<main class="content">
  <router-outlet></router-outlet>
</main>
