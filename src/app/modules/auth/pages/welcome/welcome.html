<div class="page">
  <section class="card">
    <header class="header">
      <h1>Welcome</h1>

      @if (isLoggedIn()) {
        <p class="subtitle">
          Hi, <strong>{{ username() }}</strong>. You already have an active session.
        </p>
      } @else {
        <p class="subtitle">
          You can explore the app as a guest, or sign in to access all features.
        </p>
      }
    </header>

    <div class="actions">
      @if (!isLoggedIn()) {
        <a class="btn btn-primary" routerLink="/auth/login">
          Sign in
        </a>
      } @else {
        <a class="btn btn-primary" routerLink="/user">
          Go to dashboard
        </a>
      }

      <a class="btn btn-ghost" routerLink="/auth/about">
        About us
      </a>

      <a class="btn btn-ghost" routerLink="/auth/faq">
        FAQ
      </a>
    </div>
  </section>
</div>
