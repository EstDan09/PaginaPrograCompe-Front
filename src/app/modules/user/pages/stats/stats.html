<div class="page">
  <div class="wrap">

    <!-- KPIs -->
    <section class="kpis">
      <div class="kpi">
        <div class="kpi-title">Rating</div>
        <div class="kpi-value">{{ rating() }}</div>
      </div>

      <div class="kpi">
        <div class="kpi-title">Solved</div>
        <div class="kpi-value">{{ solved() }}</div>
      </div>

      <div class="kpi">
        <div class="kpi-title">Streak</div>
        <div class="kpi-value">{{ streakDays() }} days</div>
      </div>
    </section>

    <!-- Rating Graph -->
    <section class="card">
      <h2 class="card-title">Rating Graph</h2>

      <div class="chart">
        <svg
          class="svg"
          [attr.viewBox]="'0 0 ' + ratingW + ' ' + ratingH"
          preserveAspectRatio="xMidYMid meet"
        >
          <!-- background bands (como la imagen) -->
          <rect x="0" y="0" [attr.width]="ratingW" [attr.height]="ratingH" fill="#f4f4f6"></rect>

          <g>
            <!-- banda arriba morada -->
            <rect
              [attr.x]="padding.l"
              [attr.y]="padding.t"
              [attr.width]="ratingW - padding.l - padding.r"
              [attr.height]="(ratingH - padding.t - padding.b) * 0.33"
              fill="rgba(140,120,240,0.75)"
            ></rect>

            <!-- banda medio turquesa -->
            <rect
              [attr.x]="padding.l"
              [attr.y]="padding.t + (ratingH - padding.t - padding.b) * 0.33"
              [attr.width]="ratingW - padding.l - padding.r"
              [attr.height]="(ratingH - padding.t - padding.b) * 0.20"
              fill="rgba(0,200,190,0.85)"
            ></rect>

            <!-- banda verde -->
            <rect
              [attr.x]="padding.l"
              [attr.y]="padding.t + (ratingH - padding.t - padding.b) * 0.53"
              [attr.width]="ratingW - padding.l - padding.r"
              [attr.height]="(ratingH - padding.t - padding.b) * 0.20"
              fill="rgba(0,255,140,0.80)"
            ></rect>

            <!-- banda gris abajo -->
            <rect
              [attr.x]="padding.l"
              [attr.y]="padding.t + (ratingH - padding.t - padding.b) * 0.73"
              [attr.width]="ratingW - padding.l - padding.r"
              [attr.height]="(ratingH - padding.t - padding.b) * 0.27"
              fill="rgba(140,140,140,0.75)"
            ></rect>
          </g>

          <!-- border -->
          <rect
            [attr.x]="padding.l"
            [attr.y]="padding.t"
            [attr.width]="ratingW - padding.l - padding.r"
            [attr.height]="ratingH - padding.t - padding.b"
            fill="none"
            stroke="rgba(0,0,0,0.30)"
          ></rect>

          <!-- polyline -->
          <polyline
            [attr.points]="ratingPolyline()"
            fill="none"
            stroke="rgba(0,0,0,0.55)"
            stroke-width="2"
          ></polyline>

          <!-- points -->
          @for (p of ratingPoints(); track p.x) {
            <circle
              [attr.cx]="p.x"
              [attr.cy]="p.y"
              r="3"
              fill="#f6f6f8"
              stroke="rgba(0,0,0,0.55)"
              stroke-width="1"
            ></circle>
          }

          <!-- x-axis baseline -->
          <line
            [attr.x1]="padding.l"
            [attr.x2]="ratingW - padding.r"
            [attr.y1]="ratingH - padding.b"
            [attr.y2]="ratingH - padding.b"
            stroke="rgba(0,0,0,0.20)"
          ></line>
        </svg>
      </div>
    </section>

    <!-- Solves by rating -->
    <section class="card">
      <h2 class="card-title">Solves by rating</h2>

      <div class="chart tall">
        <svg
          class="svg"
          [attr.viewBox]="'0 0 ' + barsW + ' ' + barsH"
          preserveAspectRatio="xMidYMid meet"
        >
          <rect x="0" y="0" [attr.width]="barsW" [attr.height]="barsH" fill="#f4f4f6"></rect>

          <!-- plot area -->
          <rect
            [attr.x]="barsPadding.l"
            [attr.y]="barsPadding.t"
            [attr.width]="barsW - barsPadding.l - barsPadding.r"
            [attr.height]="barsH - barsPadding.t - barsPadding.b"
            fill="rgba(160,160,160,0.25)"
            stroke="rgba(0,0,0,0.35)"
          ></rect>

          <!-- horizontal grid + y labels -->
          @for (t of yTicks(); track t) {
            <g>
              <line
                [attr.x1]="barsPadding.l"
                [attr.x2]="barsW - barsPadding.r"
                [attr.y1]="barsPadding.t + (barsH - barsPadding.t - barsPadding.b) * (1 - t / (yTicks()[yTicks().length - 1] ?? t))"
                [attr.y2]="barsPadding.t + (barsH - barsPadding.t - barsPadding.b) * (1 - t / (yTicks()[yTicks().length - 1] ?? t))"
                stroke="rgba(0,0,0,0.12)"
              ></line>

              <text
                [attr.x]="barsPadding.l - 10"
                [attr.y]="barsPadding.t + (barsH - barsPadding.t - barsPadding.b) * (1 - t / (yTicks()[yTicks().length - 1] ?? t)) + 4"
                text-anchor="end"
                font-size="12"
                fill="rgba(0,0,0,0.70)"
              >
                {{ t }}
              </text>
            </g>
          }

          <!-- bars -->
          @for (b of bars(); track b.label) {
            <rect
              [attr.x]="b.x"
              [attr.y]="b.y"
              [attr.width]="b.w"
              [attr.height]="b.h"
              [attr.fill]="b.fill"
            ></rect>

            <!-- x labels -->
            <text
              [attr.x]="b.x + b.w / 2"
              [attr.y]="barsH - 12"
              text-anchor="middle"
              font-size="12"
              fill="rgba(0,0,0,0.75)"
            >
              {{ b.label }}
            </text>
          }
        </svg>
      </div>
    </section>

    <!-- Tags -->
    <section class="card">
      <h2 class="card-title">Tags</h2>

      <div class="tags">
        @for (t of tags(); track t.tag) {
          <div class="tag-row">
            <span class="tag-name">{{ t.tag }}</span>
            <span class="tag-val">{{ t.solved }}</span>
          </div>
        }
      </div>
    </section>

  </div>
</div>
