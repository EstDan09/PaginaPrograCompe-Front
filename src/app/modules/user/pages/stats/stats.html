<div class="page">
  <div class="wrap">

    <!-- KPIs -->
    <section class="kpis">
      <div class="kpi">
        <div class="kpi-title">Rating</div>
        <div class="kpi-value">{{ rating() }}</div>
      </div>

      <div class="kpi">
        <div class="kpi-title">Solved</div>
        <div class="kpi-value">{{ solved() }}</div>
      </div>

      <div class="kpi">
        <div class="kpi-title">Streak</div>
        <div class="kpi-value">{{ streakDays() }} days</div>
      </div>
    </section>

    <!-- Rating Graph -->
    <section class="card">
      <h2 class="card-title">Rating Graph</h2>
      <app-time-chart></app-time-chart>

    </section>

    <!-- Solves by rating -->
    <section class="card">
      <h2 class="card-title">Solves by rating</h2>
      <app-bar-chart></app-bar-chart>

    </section>

    <!-- Tags -->
    <section class="card">
      <h2 class="card-title">Tags</h2>

      <div class="tags">
        @for (t of tags(); track t.tag) {
          <div class="tag-row">
            <span class="tag-name">{{ t.tag }}</span>
            <span class="tag-val">{{ t.solved }}</span>
          </div>
        }
      </div>
    </section>

  </div>
</div>
