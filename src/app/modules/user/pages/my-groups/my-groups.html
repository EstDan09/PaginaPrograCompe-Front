<div class="page">
  <div class="title-container">
    <h1 class="sec-title">{{ "MY_GROUPS.TITLE" | translate }}</h1>
  </div>
  <div class="groups">
    @for(group of groupList(); track $index) {
    <div class="card">
      <a [routerLink]="['/user', 'group', group.group_id]">
        <h2 class="group-name">{{ group.group_id}}</h2>
      </a>
    </div>
    }
  </div>
</div>
