<div class="page">
  <form class="card" [formGroup]="createUserForm" (ngSubmit)="onSubmit()">
    <header class="header">
      <h1>Create account</h1>
      <p class="subtitle">Create your CFTrainer account</p>
    </header>

    <!-- EMAIL -->
    <label class="field">
      <span>Email</span>
      <input
        type="email"
        autocomplete="email"
        formControlName="email"
        placeholder="Enter your email"
      />

      <small class="error" *ngIf="createUserForm.get('email')?.touched && createUserForm.get('email')?.hasError('required')">
        Email is required.
      </small>

      <small class="error" *ngIf="createUserForm.get('email')?.touched && createUserForm.get('email')?.hasError('email')">
        Please enter a valid email address.
      </small>
    </label>

    <!-- USERNAME -->
    <label class="field">
      <span>Username</span>
      <input
        type="text"
        autocomplete="username"
        formControlName="username"
        placeholder="Choose a username"
      />

      <small class="error" *ngIf="createUserForm.get('username')?.touched && createUserForm.get('username')?.hasError('required')">
        Username is required.
      </small>

      <small class="error" *ngIf="createUserForm.get('username')?.touched && createUserForm.get('username')?.hasError('minlength')">
        Username must be at least 3 characters long.
      </small>
    </label>

    <!-- ROLE -->
    <label class="field">
      <span>Role</span>
      <select formControlName="role">
        <option value="student">Student</option>
        <option value="coach">Coach</option>
      </select>

      <small class="error" *ngIf="createUserForm.get('role')?.touched && createUserForm.get('role')?.hasError('required')">
        Role is required.
      </small>
    </label>

    <!-- ✅ CODEFORCES HANDLE (only for student) -->
    <label class="field" *ngIf="isStudent">
      <span>Codeforces handle</span>
      <input
        type="text"
        autocomplete="off"
        formControlName="cf_account"
        placeholder="e.g. tourist"
      />
      <small class="hint">Required for students (used to verify your Codeforces account).</small>

      <small class="error" *ngIf="createUserForm.get('cf_account')?.touched && createUserForm.get('cf_account')?.hasError('required')">
        Codeforces handle is required for students.
      </small>

      <small class="error" *ngIf="createUserForm.get('cf_account')?.touched && createUserForm.get('cf_account')?.hasError('minlength')">
        Handle looks too short.
      </small>
    </label>

    <!-- PASSWORD -->
    <label class="field">
      <span>Password</span>
      <input
        type="password"
        autocomplete="new-password"
        formControlName="password"
        placeholder="Create a password"
      />

      <small class="error" *ngIf="createUserForm.get('password')?.touched && createUserForm.get('password')?.hasError('required')">
        Password is required.
      </small>

      <small class="error" *ngIf="createUserForm.get('password')?.touched && createUserForm.get('password')?.hasError('minlength')">
        Password must be at least 6 characters long.
      </small>
    </label>

    <!-- CONFIRM PASSWORD -->
    <label class="field">
      <span>Confirm password</span>
      <input
        type="password"
        autocomplete="new-password"
        formControlName="confirmPassword"
        placeholder="Repeat your password"
      />

      <small class="error" *ngIf="createUserForm.get('confirmPassword')?.touched && createUserForm.get('confirmPassword')?.hasError('required')">
        Please confirm your password.
      </small>

      <small class="error" *ngIf="createUserForm.get('confirmPassword')?.touched && passwordsMismatch">
        Passwords do not match.
      </small>
    </label>

    <div class="actions">
      <button class="btn btn-primary" type="submit">
        Create account
      </button>

      <button class="btn btn-ghost" type="button" (click)="goToLogin()">
        Go to sign in
      </button>
    </div>
  </form>
</div>
