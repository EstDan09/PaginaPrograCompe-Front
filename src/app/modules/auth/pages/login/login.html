<div class="page">
  <form class="card" [formGroup]="loginForm" (ngSubmit)="onSubmit()">
    <header class="header">
      <h1>Sign in</h1>
      <p class="subtitle">Access your CFTrainer account</p>
    </header>

    <label class="field">
      <span>Username</span>
      <input
        type="text"
        autocomplete="username"
        formControlName="username"
        placeholder="Enter your username"
      />
    </label>

    <label class="field">
      <span>Password</span>
      <input
        type="password"
        autocomplete="current-password"
        formControlName="password"
        placeholder="Enter your password"
      />
    </label>

    <div class="actions">
      <button class="btn btn-primary" type="submit">
        Sign in
      </button>

      <button class="btn btn-ghost" type="button" (click)="onCreateAccount()">
        Create account
      </button>
    </div>
  </form>
</div>
