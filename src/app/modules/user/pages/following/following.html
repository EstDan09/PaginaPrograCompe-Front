<div class="page">
  <h1 class="title">Following</h1>

  <section class="card">
    @if (following().length > 0) {
      <ul class="list">
        @for (f of following(); track f.name) {
          <li class="row">
            <div class="avatar">
              {{ (safeName(f.name) | slice:0:1) }}
            </div>

            <a class="name" [routerLink]="['/user', 'profile', safeName(f.name)]">
              {{ safeName(f.name) }}
            </a>
          </li>
        }
      </ul>
    } @else {
      <div class="empty">
        <p class="empty-text">No estás siguiendo a nadie todavía.</p>
      </div>
    }
  </section>
</div>
